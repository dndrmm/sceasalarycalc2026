    <style>

<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-blue-600 selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        const DefaultMatrix = [
          { step: 1, bSalary: 53237, bCount: 12, mCount: 5, m30Count: 0 },
          { step: 2, bSalary: 54372, bCount: 13.25, mCount: 6, m30Count: 0 },
          { step: 3, bSalary: 55507, bCount: 9, mCount: 8, m30Count: 1 },
          { step: 4, bSalary: 56642, bCount: 2, mCount: 1, m30Count: 0 },
          { step: 5, bSalary: 57777, bCount: 0, mCount: 3, m30Count: 0 },
          { step: 6, bSalary: 58912, bCount: 1, mCount: 2, m30Count: 0 },
          { step: 7, bSalary: 60047, bCount: 4, mCount: 3, m30Count: 0 },
          { step: 8, bSalary: 61183, bCount: 2, mCount: 0, m30Count: 0 },
          { step: 9, bSalary: 62318, bCount: 0, mCount: 0, m30Count: 0 },
          { step: 10, bSalary: 63453, bCount: 4, mCount: 3, m30Count: 0 },
          { step: 11, bSalary: 64588, bCount: 0, mCount: 1, m30Count: 0 },
          { step: 12, bSalary: 65723, bCount: 1, mCount: 2, m30Count: 0 },
          { step: 13, bSalary: 66858, bCount: 2, mCount: 0, m30Count: 0 },
          { step: 14, bSalary: 67993, bCount: 3, mCount: 0, m30Count: 0 },
          { step: 15, bSalary: 69128, bCount: 2, mCount: 2, m30Count: 0 },
          { step: 16, bSalary: 70263, bCount: 4, mCount: 0, m30Count: 0 },
          { step: 17, bSalary: 71398, bCount: 2, mCount: 2, m30Count: 0 },
          { step: 18, bSalary: 72534, bCount: 0, mCount: 0, m30Count: 0 },
          { step: 19, bSalary: 73669, bCount: 3, mCount: 5, m30Count: 2 },
          { step: 20, bSalary: 75517, bCount: 1, mCount: 1, m30Count: 2 },
          { step: 21, bSalary: 77330, bCount: 5, mCount: 4, m30Count: 0 }
        ];

        const AnalyticsBargainingEngine = () => {
          const [years, setYears] = useState(4);

          const [annualIncreases, setAnnualIncreases] = useState([3.99, 3.99, 3.99, 3.99, 3.99, 3.99, 3.99, 3.99]);
          const [superMaxAmount, setSuperMaxAmount] = useState(3800);

          const [stepCompression, setStepCompression] = useState(50);
          const [useSmoothing, setUseSmoothing] = useState(true);
          const [targetUniformGap, setTargetUniformGap] = useState(1500);
          
          const [preserveJumps, setPreserveJumps] = useState(true);
          const [jumpRetention, setJumpRetention] = useState(50);

          const [targetCompactionCuts, setTargetCompactionCuts] = useState(0);
          const [compactionYear, setCompactionYear] = useState(1);
          
          const [useSmartBoost, setUseSmartBoost] = useState(true);
          const [phaseInBoost, setPhaseInBoost] = useState(true);
          const [boostStartGap, setBoostStartGap] = useState(797);
          const [cosmeticGapOverride, setCosmeticGapOverride] = useState(417);
          
          const [autoCleanGaps, setAutoCleanGaps] = useState(true);

          const [isConfiguring, setIsConfiguring] = useState(false);
          const [matrix, setMatrix] = useState(DefaultMatrix);

          const [userStep, setUserStep] = useState(2);
          const [userLane, setUserLane] = useState('m');
          const [insurance, setInsurance] = useState('single');

          const LANE_DIFF = 1000;
          const actualCompYear = Math.min(compactionYear, years);

          const [monthlyHealthcare, setMonthlyHealthcare] = useState({
            single: [0, 20, 20, 20, 20, 20, 20, 20, 20],
            nonSingle: [0, 40, 40, 40, 40, 40, 40, 40, 40]
          });

          const formatCount = (num) => {
            const n = Number(num);
            return Number.isInteger(n) ? n : n.toFixed(2);
          };

          const calculatePayroll = (grid) => {
            return grid.reduce((sum, r) => {
              return sum + (Number(r.bSalary) * Number(r.bCount)) + ((Number(r.bSalary) + LANE_DIFF) * Number(r.mCount)) + ((Number(r.bSalary) + LANE_DIFF * 2) * Number(r.m30Count));
            }, 0);
          };

          const generateModelOutput = (initialGrid, increaseArray, superMaxVal, comp, totalCutsAllowed, applySmoothing, targetGap, applySmartBoost, cosmeticGap, applyBoostPhaseIn, startGap, compYear, applyAutoClean) => {
            let results = [];
            let current = [...initialGrid.map(m => ({...m}))];
            const initialPayroll = calculatePayroll(current);
            results.push({
                year: 0, matrix: current, gridCost: initialPayroll, totalCost: initialPayroll + Number(superMaxVal),
                baseRaise: 0, stepMovementCost: 0, stepMovementPct: 0, oldMatrixStepPct: 0, compactedThisYear: false
            });

            for (let y = 1; y <= years; y++) {
              const previousPayroll = calculatePayroll(current);
              const targetBudget = (previousPayroll * (1 + ((Number(increaseArray[y - 1]) || 0) / 100)));

              let nextLayout = current.map(r => ({ ...r, bCount: 0, mCount: 0, m30Count: 0, totalPop: 0 }));
              for (let i = 0; i < current.length; i++) {
                const targetIndex = i === current.length - 1 ? i : i + 1;
                nextLayout[targetIndex].bCount += Number(current[i].bCount);
                nextLayout[targetIndex].mCount += Number(current[i].mCount);
                nextLayout[targetIndex].m30Count += Number(current[i].m30Count);
              }
              nextLayout.forEach(r => r.totalPop = Number(r.bCount) + Number(r.mCount) + Number(r.m30Count));

              let compactedThisYear = false;
              if (y === compYear) {
                let cutsToMake = totalCutsAllowed;
                while (cutsToMake > 0 && nextLayout.length > 1 && nextLayout[0].totalPop === 0) {
                  nextLayout.shift();
                  compactedThisYear = true;
                  cutsToMake--;
                }
              }

              const costOfStepOnly = nextLayout.reduce((sum, r) => {
                const historicalMatch = current.find(oldRow => oldRow.step === r.step) || current[current.length - 1];
                const base = Number(historicalMatch.bSalary);
                return sum + (base * Number(r.bCount)) + ((base + LANE_DIFF) * Number(r.mCount)) + ((base + LANE_DIFF * 2) * Number(r.m30Count));
              }, 0);

              const stepMovementCost = costOfStepOnly - previousPayroll;
              const stepMovementPct = previousPayroll > 0 ? (stepMovementCost / previousPayroll) * 100 : 0;

              const leftover = targetBudget - costOfStepOnly;
              const totalHeadcount = nextLayout.reduce((sum, r) => sum + r.totalPop, 0);

              let finalized = [];
              let yearBaseRaise = 0;

              if (applySmoothing) {
                let corrections = new Array(nextLayout.length).fill(0);
                for (let i = 1; i < nextLayout.length; i++) {
                  const historicalCurrent = current.find(oldRow => oldRow.step === nextLayout[i].step) || current[current.length - 1];
                  const historicalBelow = current.find(oldRow => oldRow.step === nextLayout[i-1].step) || current[current.length - 1];
                  const currentGap = Number(historicalCurrent.bSalary) - Number(historicalBelow.bSalary);
                  
                  let specificTargetGap = targetGap;
                  
                  if (preserveJumps) {
                      const initialCurrent = initialGrid.find(o => o.step === nextLayout[i].step);
                      const initialBelow = initialGrid.find(o => o.step === nextLayout[i-1].step);
                      if (initialCurrent && initialBelow) {
                          const originalGap = Number(initialCurrent.bSalary) - Number(initialBelow.bSalary);
                          if (originalGap > targetGap) {
                              specificTargetGap = targetGap + ((originalGap - targetGap) * (jumpRetention / 100));
                          }
                      }
                  }

                  const gapDiff = specificTargetGap - currentGap;
                  const annualCorrection = Math.round(gapDiff / (years - y + 1));
                  corrections[i] = corrections[i-1] + annualCorrection;
                }

                const minCorrection = Math.min(...corrections);
                const normalizedCorrections = corrections.map(c => c - minCorrection);
                const correctionCost = nextLayout.reduce((sum, r, idx) => sum + (normalizedCorrections[idx] * r.totalPop), 0);
                const flatPool = leftover - correctionCost;

                const flatRaise = Math.round(totalHeadcount > 0 ? flatPool / totalHeadcount : 0);
                yearBaseRaise = flatRaise;

                finalized = nextLayout.map((row, index) => {
                  const baseOld = Number(current.find(old => old.step === row.step)?.bSalary || current[current.length-1].bSalary);
                  let cellRaise = flatRaise + normalizedCorrections[index];
                  if (index === nextLayout.length - 1 && cellRaise < 500) cellRaise = 500;
                  let newBase = baseOld + cellRaise;
                  return { ...row, bSalary: newBase, appliedRaise: cellRaise };
                });
              } else {
                let weightedIndexSum = 0;
                let maxPopulatedIndex = 0;
                nextLayout.forEach((r, idx) => {
                  if (r.totalPop > 0) {
                    weightedIndexSum += (r.totalPop * idx);
                    maxPopulatedIndex = Math.max(maxPopulatedIndex, idx);
                  }
                });
                const maxAllowedComp = totalHeadcount > 0 && maxPopulatedIndex > 0
                  ? Math.max(0, (leftover - (500 * totalHeadcount)) / ((maxPopulatedIndex * totalHeadcount) - weightedIndexSum)) : comp;
                const safeComp = Math.round(maxAllowedComp > 0 ? Math.min(comp, maxAllowedComp) : 0);
                const baseRaise = Math.round(totalHeadcount > 0 ? (leftover + (safeComp * weightedIndexSum)) / totalHeadcount : 0);
                yearBaseRaise = baseRaise;

                finalized = nextLayout.map((row, index) => {
                  const historicalMatch = current.find(oldRow => oldRow.step === row.step) || current[current.length - 1];
                  let cellRaise = 0;
                  if (row.totalPop > 0) {
                    cellRaise = Math.max(500, baseRaise - (index * safeComp));
                  } else {
                    cellRaise = baseRaise - (index * safeComp);
                  }
                  let newBase = Number(historicalMatch.bSalary) + cellRaise;
                  return { ...row, bSalary: newBase, appliedRaise: cellRaise };
                });
              }

              // --- TOP STEP PLUG RUNS BEFORE AUTO-CLEAN ---
              let preCleanGridCost = calculatePayroll(finalized);
              let preCleanRemainder = targetBudget - preCleanGridCost;
              let topStepRow = finalized[finalized.length - 1];

              if (topStepRow.totalPop > 0) {
                  let topStepAdjustment = Math.round(preCleanRemainder / topStepRow.totalPop);
                  topStepRow.bSalary += topStepAdjustment;
                  topStepRow.appliedRaise += topStepAdjustment;
              }

              // --- AUTO-CLEAN OVERRIDES TOP STEP PLUG ---
              if (applyAutoClean && finalized.length > 1) {
                let gaps = [];
                for(let i = 0; i < finalized.length - 1; i++){
                  gaps.push(Number(finalized[i+1].bSalary) - Number(finalized[i].bSalary));
                }
                let counts = {}; let maxCount = 0; let modeGap = gaps[0];
                gaps.forEach(g => {
                  counts[g] = (counts[g] || 0) + 1;
                  if(counts[g] > maxCount) { maxCount = counts[g]; modeGap = g; }
                });
                let currentSal = Number(finalized[0].bSalary);
                for(let i = 0; i < finalized.length - 1; i++){
                  let originalGap = Number(finalized[i+1].bSalary) - Number(finalized[i].bSalary);
                  if (Math.abs(originalGap - modeGap) > 0 && Math.abs(originalGap - modeGap) <= 5) {
                    currentSal += Math.round(modeGap);
                  } else { currentSal += Math.round(originalGap); }
                  finalized[i+1].bSalary = Math.round(currentSal);
                  const oldBase = Number(current.find(c => c.step === finalized[i+1].step)?.bSalary || 0);
                  finalized[i+1].appliedRaise = Math.round(finalized[i+1].bSalary - oldBase);
                }
              }

              // --- YEAR-OVER-YEAR PHASED SMART BOOST ---
              if (applySmartBoost) {
                let firstPopIdx = finalized.findIndex(r => r.totalPop > 0);
                if (firstPopIdx === -1) firstPopIdx = finalized.length - 1;
                
                let currentYearGap = cosmeticGap;
                if (applyBoostPhaseIn && years > 1) {
                  const fraction = (y - 1) / (years - 1); // 0 in Y1, 1 in final year
                  currentYearGap = Math.round(startGap - (startGap - cosmeticGap) * fraction);
                } else if (applyBoostPhaseIn && years === 1) {
                  currentYearGap = cosmeticGap;
                }
                
                for (let i = firstPopIdx - 1; i >= 0; i--) {
                  finalized[i].bSalary = Math.round(finalized[i+1].bSalary - currentYearGap);
                  const oldBase = Number(current.find(c => c.step === finalized[i].step)?.bSalary || 0);
                  finalized[i].appliedRaise = Math.round(finalized[i].bSalary - oldBase);
                }
              }

              // --- FINAL COST CALCULATIONS ---
              const basePopCostOnNewGrid = initialGrid.reduce((sum, r) => {
                const newRow = finalized.find(f => f.step === r.step) || finalized[finalized.length - 1];
                const base = Number(newRow.bSalary);
                return sum + (base * Number(r.bCount)) + ((base + LANE_DIFF) * Number(r.mCount)) + ((base + LANE_DIFF * 2) * Number(r.m30Count));
              }, 0);

              let movedBasePop = initialGrid.map(r => ({ ...r, bCount: 0, mCount: 0, m30Count: 0 }));
              for (let i = 0; i < initialGrid.length; i++) {
                const targetIndex = i === initialGrid.length - 1 ? i : i + 1;
                movedBasePop[targetIndex].bCount += Number(initialGrid[i].bCount);
                movedBasePop[targetIndex].mCount += Number(initialGrid[i].mCount);
                movedBasePop[targetIndex].m30Count += Number(initialGrid[i].m30Count);
              }

              const movedBasePopCostOnNewGrid = movedBasePop.reduce((sum, r) => {
                const newRow = finalized.find(f => f.step === r.step) || finalized[finalized.length - 1];
                const base = Number(newRow.bSalary);
                return sum + (base * Number(r.bCount)) + ((base + LANE_DIFF) * Number(r.mCount)) + ((base + LANE_DIFF * 2) * Number(r.m30Count));
              }, 0);

              const oldMatrixStepCost = movedBasePopCostOnNewGrid - basePopCostOnNewGrid;
              const oldMatrixStepPct = basePopCostOnNewGrid > 0 ? (oldMatrixStepCost / basePopCostOnNewGrid) * 100 : 0;

              let draftGridCost = calculatePayroll(finalized);

              results.push({
                year: y, matrix: finalized, gridCost: draftGridCost,
                totalCost: draftGridCost + Number(superMaxVal),
                baseRaise: yearBaseRaise, stepMovementCost, stepMovementPct, oldMatrixStepPct, compactedThisYear
              });
              current = finalized;
            }
            return results;
          };

          const modelOutput = useMemo(() => {
            return generateModelOutput(matrix, annualIncreases, superMaxAmount, stepCompression, targetCompactionCuts, useSmoothing, targetUniformGap, useSmartBoost, cosmeticGapOverride, phaseInBoost, boostStartGap, years, actualCompYear, autoCleanGaps, preserveJumps, jumpRetention);
          }, [matrix, annualIncreases, superMaxAmount, stepCompression, targetCompactionCuts, useSmoothing, targetUniformGap, useSmartBoost, cosmeticGapOverride, phaseInBoost, boostStartGap, years, actualCompYear, autoCleanGaps, preserveJumps, jumpRetention]);

          const memberNetSummary = useMemo(() => {
            let trajectory = [];
            let aggregateNet = 0;
            let currentStepsFromTop = 0;
            const year0Matrix = modelOutput[0].matrix;
            const initialIndex = year0Matrix.findIndex(r => r.step == userStep);
            if (initialIndex !== -1) { currentStepsFromTop = year0Matrix.length - 1 - initialIndex; }

            modelOutput.forEach((proj, y) => {
              if (y > 0) { currentStepsFromTop = Math.max(0, currentStepsFromTop - 1); }
              let currentIndex = proj.matrix.length - 1 - currentStepsFromTop;
              let activeRow = proj.matrix[currentIndex];
              if (!activeRow) return;

              let gross = Number(activeRow.bSalary) || 0;
              if (userLane === 'm') gross += LANE_DIFF;
              if (userLane === 'm30') gross += (LANE_DIFF * 2);

              const safeMonthIndex = Math.min(y, (monthlyHealthcare[insurance]?.length - 1) || 0);
              const monthlyCost = insurance === 'none' ? 0 : (Number(monthlyHealthcare[insurance][safeMonthIndex]) || 0);
              const annualHcCost = monthlyCost * 12;
              const net = gross - annualHcCost;
              if (y > 0) aggregateNet += net;

              trajectory.push({ year: y, trackingNum: activeRow.step, displayLabel: currentStepsFromTop === 0 ? "TOP" : currentStepsFromTop, gross, annualHcCost, net });
            });
            return { trajectory, aggregateNet };
          }, [modelOutput, userStep, userLane, insurance, monthlyHealthcare]);

          const exportToCSV = () => {
            let csvContent = "Year,To Top,Sheet Step,B Count,M Count,M30 Count,B Base,M Column,M+30 Column,On-Scale Raise,Increment\n";

            modelOutput.forEach((proj, yearIndex) => {
              proj.matrix.forEach((row, i) => {
                const nextRow = proj.matrix[i + 1];
                const increment = nextRow ? nextRow.bSalary - row.bSalary : "";
                const stepsToTop = proj.matrix.length - 1 - i;
                const toTopLabel = stepsToTop === 0 ? "TOP" : stepsToTop;
                const raise = yearIndex === 0 ? "N/A" : Math.round(row.appliedRaise);

                csvContent += `${yearIndex},${toTopLabel},${row.step},${row.bCount},${row.mCount},${row.m30Count},${Math.round(row.bSalary)},${Math.round(row.bSalary + LANE_DIFF)},${Math.round(row.bSalary + LANE_DIFF * 2)},${raise},${increment ? Math.round(increment) : ""}\n`;
              });
              csvContent += "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "Bargaining_Schedule_Projections.csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          };

          const exportMobileApp = () => {
            const htmlContent = `<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"><\/script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin><\/script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin><\/script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"><\/script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        select { appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 1rem center; background-size: 1em; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useMemo } = React;

        const YEARS = ${years};
        const LANE_DIFF = 1000;
        const MONTHLY_HEALTHCARE = ${JSON.stringify(monthlyHealthcare)};
        const MODEL_OUTPUT = ${JSON.stringify(modelOutput)};

        const MemberPortal = () => {
          const [userStep, setUserStep] = useState(MODEL_OUTPUT[0].matrix[0].step);
          const [userLane, setUserLane] = useState('b');
          const [insurance, setInsurance] = useState('single');

          const memberTrajectory = useMemo(() => {
            let trajectory = [];
            let aggregateNet = 0;

            let currentStepsFromTop = 0;
            const year0Matrix = MODEL_OUTPUT[0].matrix;
            const initialIndex = year0Matrix.findIndex(r => r.step == userStep);
            if (initialIndex !== -1) currentStepsFromTop = year0Matrix.length - 1 - initialIndex;

            MODEL_OUTPUT.forEach((proj, y) => {
              if (y > 0) currentStepsFromTop = Math.max(0, currentStepsFromTop - 1);
              let activeRow = proj.matrix[proj.matrix.length - 1 - currentStepsFromTop];
              if (!activeRow) return;

              let gross = Number(activeRow.bSalary) || 0;
              if (userLane === 'm') gross += LANE_DIFF;
              if (userLane === 'm30') gross += (LANE_DIFF * 2);

              const safeMonthIndex = Math.min(y, (MONTHLY_HEALTHCARE[insurance]?.length - 1) || 0);
              const annualHcCost = insurance === 'none' ? 0 : (MONTHLY_HEALTHCARE[insurance][safeMonthIndex] * 12);
              const net = gross - annualHcCost;

              if (y > 0) aggregateNet += net;

              trajectory.push({
                year: y,
                stepLabel: activeRow.step,
                gross,
                annualHcCost,
                net
              });
            });

            return { trajectory, aggregateNet };
          }, [userStep, userLane, insurance]);

          const totalGrowth = memberTrajectory.trajectory[memberTrajectory.trajectory.length - 1].net - memberTrajectory.trajectory[0].net;

          return (
            <div class="max-w-md mx-auto min-h-screen bg-slate-950 pb-12">
                <div class="bg-slate-900 border-b border-slate-800 px-6 pt-10 pb-8 shadow-2xl rounded-b-3xl">
                    <h1 class="text-xs font-bold text-blue-500 uppercase tracking-widest mb-1">Contract Proposal</h1>
                    <h2 class="text-2xl font-black text-white leading-tight">Your Pay Estimator</h2>
                    <p class="text-sm text-slate-400 mt-2">{"See exactly how the proposed " + YEARS + "-year agreement increases your salary."}</p>
                </div>

                <div class="px-6 mt-6 space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5 ml-1">Current Base Step</label>

                            <div key={idx} class={`flex flex-col sm:flex-row justify-between items-start sm:items-center p-2.5 rounded-lg border ${idx === 0 ? 'bg-slate-950 border-slate-800' : 'bg-slate-850/50 border-transparent'}`}>
                              <div class="whitespace-nowrap pr-2">
                                <span class="text-xs font-bold text-blue-400 block sm:inline">{idx === 0 ? 'Current Baseline' : `Contract Year ${idx}`}</span>
                                <div class="text-[10px] text-slate-400 font-medium">To Top: {t.displayLabel}</div>
                              </div>
                              <div class="text-left sm:text-right mt-1 sm:mt-0 flex-shrink-0">
                                <span class="text-sm font-bold text-slate-200">${Math.round(t.net).toLocaleString()}</span>
                                <div class="text-[9px] text-slate-500 font-mono">Gross: ${Math.round(t.gross).toLocaleString()}</div>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>

                    <div class="xl:col-span-8 lg:col-span-8 space-y-4 main-print-expand">
                      {modelOutput.map((proj, idx) => (
                        <div key={idx} class={`bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-xl ${idx === 0 ? 'no-print' : 'print-card'}`}>
                          <div class="flex justify-between items-center border-b border-slate-800 print-border pb-2 mb-2">
                            <div>
                              <div class="flex items-center gap-2">
                                <h3 class="font-black text-slate-200 text-sm print-text">
                                  {idx === 0 ? "Baseline Distribution" : `Contract Year ${idx} (${annualIncreases[idx-1]}%)`}
                                </h3>
                                {proj.compactedThisYear && (
                                  <span class="text-[9px] font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded no-print">
                                    Step(s) Removed (Compacted)
                                  </span>
                                )}
                              </div>
                              {idx > 0 && (
                                <div class="text-[10px] text-slate-400 mt-1 print-text space-y-0.5">
                                  <p>
                                    Step-Movement Cost: <span class="text-amber-400 font-mono font-semibold">${Math.round(proj.stepMovementCost).toLocaleString()}</span>
                                    <span class="text-slate-500 ml-1 print-text">({proj.stepMovementPct.toFixed(2)}% of previous pool value)</span>
                                  </p>
                                  {idx === years && (
                                    <div class="mt-2 p-2 bg-blue-950/20 border border-blue-900/50 rounded inline-block">
                                      <p class="text-blue-400 font-medium">
                                        <span class="font-bold text-blue-300">Base Matrix Incremental Cost:</span> {proj.oldMatrixStepPct.toFixed(2)}%
                                      </p>
                                      <p class="text-[9px] text-slate-500 mt-0.5">If the matrix was completely unchanged from Year 0, this is the percentage cost it would require to advance the headcount 1 step.</p>
                                    </div>
                                  )}
                                </div>
                              )}
                            </div>
                            <div class="text-right flex flex-col gap-1 items-end">
                              <span class="text-[10px] font-mono bg-slate-950 px-2.5 py-1 rounded border border-slate-800 text-slate-400 print-text inline-block">
                                Grid Payroll: ${Math.round(proj.gridCost).toLocaleString()}
                              </span>
                              {Number(superMaxAmount) > 0 && (
                                <span class="text-[10px] font-mono bg-red-950/30 px-2.5 py-1 rounded border border-red-900/50 text-red-400 print-text inline-block">
                                  Super Max: ${Math.round(superMaxAmount).toLocaleString()}
                                </span>
                              )}
                              <span class="text-[11px] font-mono bg-slate-800 px-2.5 py-1 rounded border border-slate-700 font-bold text-white print-text shadow inline-block">
                                Total Cost: ${Math.round(proj.totalCost).toLocaleString()}
                              </span>
                            </div>
                          </div>

                          <table class="w-full text-center text-xs mt-3">
                            <thead>
                              <tr class="text-slate-500 font-bold text-[9px] uppercase tracking-wider border-b border-slate-800 print-table-header">
                                <th class="p-1 text-left">TO TOP</th>
                                <th class="p-1 no-print">Sheet Step</th>
                                <th class="p-1 no-print">Count</th>
                                <th class="p-1 text-slate-300">B Column</th>
                                <th class="p-1 text-slate-400">M Column</th>
                                <th class="p-1 text-slate-400">M+30 Column</th>
                                {idx > 0 && <th class="p-1 text-emerald-500 bg-emerald-950/30 rounded-t border-b border-emerald-900 print-text print-border">On-Scale Raise (+)</th>}
                                <th class="p-1 text-right text-slate-600">Increment</th>
                              </tr>
                            </thead>
                            <tbody>
                              {proj.matrix.map((row, i) => {
                                const nextRow = proj.matrix[i + 1];
                                const gap = nextRow ? nextRow.bSalary - row.bSalary : null;

                                const stepsToTop = proj.matrix.length - 1 - i;
                                const countdownLabel = stepsToTop === 0 ? "TOP" : stepsToTop;

                                return (
                                  <tr key={i} class="border-b border-slate-850/30 hover:bg-slate-850/40 text-slate-300 transition print-border">
                                    <td class="p-1 font-bold text-left text-white text-xs print-text">{countdownLabel}</td>
                                    <td class="p-1 text-slate-600 font-mono text-[11px] no-print">Step {row.step}</td>
                                    <td class="p-1 text-slate-500 font-mono text-[11px] no-print">{formatCount(row.bCount)}/{formatCount(row.mCount)}/{formatCount(row.m30Count)}</td>
                                    <td class="p-1 font-semibold text-slate-100 print-text">${Math.round(row.bSalary).toLocaleString()}</td>
                                    <td class="p-1 text-slate-400 print-text">${Math.round(row.bSalary + LANE_DIFF).toLocaleString()}</td>
                                    <td class="p-1 text-slate-400 print-text">${Math.round(row.bSalary + (LANE_DIFF * 2)).toLocaleString()}</td>
                                    {idx > 0 && <td class="p-1 text-emerald-400 font-mono bg-emerald-950/20 border-r border-l border-emerald-900/30 font-bold print-text print-border">+${Math.round(row.appliedRaise).toLocaleString()}</td>}
                                    <td class="p-1 text-right font-mono text-slate-500 text-[11px] print-text">{gap ? `$${Math.round(gap).toLocaleString()}` : '—'}</td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>
                      ))}
                    </div>

                  </div>
                </div>
              )}
            </div>
          );
        };

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<AnalyticsBargainingEngine />);
    </script>
</body>
</html>
