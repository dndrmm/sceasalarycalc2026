<body class="bg-slate-950 text-slate-100 min-h-screen antialiased">

        const MODEL_OUTPUT = [{"year":0,"matrix":[{"step":"1","bSalary":53237,"bCount":12,"mCount":5,"m30Count":0},{"step":"2","bSalary":54372,"bCount":13.25,"mCount":6,"m30Count":0},{"step":"3","bSalary":55507,"bCount":9,"mCount":8,"m30Count":1},{"step":"4","bSalary":56642,"bCount":2,"mCount":1,"m30Count":0},{"step":"5","bSalary":57777,"bCount":0,"mCount":3,"m30Count":0},{"step":"6","bSalary":58912,"bCount":1,"mCount":2,"m30Count":0},{"step":"7","bSalary":60047,"bCount":4,"mCount":3,"m30Count":0},{"step":"8","bSalary":61183,"bCount":2,"mCount":0,"m30Count":0},{"step":"9","bSalary":62318,"bCount":0,"mCount":0,"m30Count":0},{"step":"10","bSalary":63453,"bCount":4,"mCount":3,"m30Count":0},{"step":"11","bSalary":64588,"bCount":0,"mCount":1,"m30Count":0},{"step":"12","bSalary":65723,"bCount":1,"mCount":2,"m30Count":0},{"step":"13","bSalary":66858,"bCount":2,"mCount":0,"m30Count":0},{"step":"14","bSalary":67993,"bCount":3,"mCount":0,"m30Count":0},{"step":"15","bSalary":69128,"bCount":2,"mCount":2,"m30Count":0},{"step":"16","bSalary":70263,"bCount":4,"mCount":0,"m30Count":0},{"step":"17","bSalary":71398,"bCount":2,"mCount":2,"m30Count":0},{"step":"18","bSalary":72534,"bCount":0,"mCount":0,"m30Count":0},{"step":"19","bSalary":73669,"bCount":3,"mCount":5,"m30Count":2},{"step":"20","bSalary":75517,"bCount":1,"mCount":1,"m30Count":2},{"step":"21","bSalary":77330,"bCount":5,"mCount":4,"m30Count":0}],"gridCost":7693011,"totalCost":7696811,"baseRaise":0,"stepMovementCost":0,"stepMovementPct":0,"compactedThisYear":false},{"year":1,"matrix":[{"step":"1","bSalary":55115,"bCount":0,"mCount":0,"m30Count":0,"totalPop":0,"appliedRaise":1878},{"step":"2","bSalary":55812,"bCount":12,"mCount":5,"m30Count":0,"totalPop":17,"appliedRaise":1440},{"step":"3","bSalary":56943,"bCount":13.25,"mCount":6,"m30Count":0,"totalPop":19.25,"appliedRaise":1436},{"step":"4","bSalary":58074,"bCount":9,"mCount":8,"m30Count":1,"totalPop":18,"appliedRaise":1432},{"step":"5","bSalary":59205,"bCount":2,"mCount": otalPop":3,"appliedRaise":1929},{"step":"19","bSalary":80327,"bCount":2,"mCount":2,"m30Count":0,"totalPop":4,"appliedRaise":1924},{"step":"20","bSalary":81444,"bCount":4,"mCount":0,"m30Count":0,"totalPop":4,"appliedRaise":1741},{"step":"21","bSalary":82561,"bCount":11,"mCount":12,"m30Count":4,"totalPop":27,"appliedRaise":1565}],"gridCost":8996286.5,"totalCost":9000086.5,"baseRaise":739,"stepMovementCost":113876.5,"stepMovementPct":1.3163230607832994,"compactedThisYear":false}];

        const MemberPortal = () => {
          const [userStep, setUserStep] = useState(MODEL_OUTPUT[0].matrix[0].step);
          const [userLane, setUserLane] = useState('b');
          const [insurance, setInsurance] = useState('single');

          const memberTrajectory = useMemo(() => {
            let trajectory = [];
            let aggregateNet = 0;

            let currentStepsFromTop = 0;
            const year0Matrix = MODEL_OUTPUT[0].matrix;
            const initialIndex = year0Matrix.findIndex(r => r.step == userStep);
            if (initialIndex !== -1) currentStepsFromTop = year0Matrix.length - 1 - initialIndex;

            MODEL_OUTPUT.forEach((proj, y) => {
              if (y > 0) currentStepsFromTop = Math.max(0, currentStepsFromTop - 1);
              let activeRow = proj.matrix[proj.matrix.length - 1 - currentStepsFromTop];
              if (!activeRow) return;

              let gross = Number(activeRow.bSalary) || 0;
              if (userLane === 'm') gross += LANE_DIFF;
              if (userLane === 'm30') gross += (LANE_DIFF * 2);

              const safeMonthIndex = Math.min(y, (MONTHLY_HEALTHCARE[insurance]?.length - 1) || 0);
              const annualHcCost = insurance === 'none' ? 0 : (MONTHLY_HEALTHCARE[insurance][safeMonthIndex] * 12);
              const net = gross - annualHcCost;

              if (y > 0) aggregateNet += net;

              trajectory.push({
                year: y,
                stepLabel: activeRow.step,
                gross,
                annualHcCost,
                net
              });
            });

            return { trajectory, aggregateNet };
          }, [userStep, userLane, insurance]);

          const totalGrowth = memberTrajectory.trajectory[memberTrajectory.trajectory.length - 1].net - memberTrajectory.trajectory[0].net;

          return (
            <div class="max-w-md mx-auto min-h-screen bg-slate-950 pb-12">
                <div class="bg-slate-900 border-b border-slate-800 px-6 pt-10 pb-8 shadow-2xl rounded-b-3xl">
                    <h1 class="text-xs font-bold text-blue-500 uppercase tracking-widest mb-1">Contract Proposal</h1>
                    <h2 class="text-2xl font-black text-white leading-tight">Your Pay Estimator</h2>
                    <p class="text-sm text-slate-400 mt-2">{"See exactly how the proposed " + YEARS + "-year agreement increases your salary."}</p>
                </div>

                <div class="px-6 mt-6 space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5 ml-1">Current Base Step</label>
                        <select value={userStep} onChange={(e) => setUserStep(e.target.value)} class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-4 text-base font-semibold shadow-lg outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition">
                            {MODEL_OUTPUT[0].matrix.map(m => (
                            <option key={m.step} value={m.step}>{"Step " + m.step}</option>
                            ))}
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5 ml-1">Current Column / Track</label>
                        <select value={userLane} onChange={(e) => setUserLane(e.target.value)} class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-4 text-base font-semibold shadow-lg outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition">
                            <option value="b">Bachelors (B)</option>
                            <option value="m">Masters (M)</option>
                            <option value="m30">Masters + 30 (M+30)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5 ml-1">Healthcare Election</label>
                        <select value={insurance} onChange={(e) => setInsurance(e.target.value)} class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-4 text-base font-semibold shadow-lg outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition">
                            <option value="single">Single Plan</option>
                            <option value="nonSingle">Non-Single Plan (Family/Couple)</option>
                            <option value="none">Opt-Out / No District Healthcare</option>
                        </select>
                    </div>
                </div>

                <div class="px-6 mt-8">
                    <div class="bg-emerald-950/40 border border-emerald-900/50 rounded-2xl p-6 text-center shadow-[0_0_40px_-10px_rgba(16,185,129,0.2)]">
                        <span class="block text-xs font-bold text-emerald-500 uppercase tracking-widest mb-1">{"Total " + YEARS + "-Year Contract Value"}</span>
                        <div class="text-4xl font-black text-emerald-400 font-mono tracking-tight shadow-emerald-400/20 drop-shadow-lg">
                            {"$" + Math.round(memberTrajectory.aggregateNet).toLocaleString()}
                        </div>
                        <span class="block text-[10px] text-slate-500 mt-2 font-medium">{"Combined net take-home pay over " + YEARS + " years."}</span>

                        <div class="mt-4 pt-4 border-t border-emerald-800/50">
                            <span class="block text-xs font-bold text-emerald-500 uppercase tracking-widest mb-1">Final Year Net Increase</span>
                            <div class="text-2xl font-black text-white font-mono">
                                {"+$" + Math.round(totalGrowth).toLocaleString()}
                            </div>
                            <span class="block text-[10px] text-slate-500 mt-1 font-medium">{"How much more you will take home in Year " + YEARS + " vs. today."}</span>
                        </div>
                    </div>
                </div>

                <div class="px-6 mt-8 space-y-4">
                    <h3 class="text-sm font-bold text-white border-b border-slate-800 pb-2 ml-1">Year-by-Year Breakdown</h3>

                    {memberTrajectory.trajectory.map((t, idx) => (
                        <div key={idx} class={"p-5 rounded-xl border " + (idx === 0 ? "bg-slate-900/50 border-slate-800 border-dashed" : "bg-slate-900 border-slate-700 shadow-md")}>
                            <div class="flex justify-between items-end mb-3">
                                <div>
                                    <div class={"text-sm font-black " + (idx === 0 ? "text-slate-400" : "text-blue-400")}>
                                        {idx === 0 ? "Current Pay (Baseline)" : "Contract Year " + idx}
                                    </div>
                                    <div class="text-xs text-slate-500 font-medium mt-0.5">{"Assumed Level: Step " + t.stepLabel}</div>
                                </div>
                                <div class="text-right">
                                    <div class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-0.5">Net Pay</div>
                                    <div class={"text-xl font-black font-mono " + (idx === 0 ? "text-slate-300" : "text-white")}>
                                        {"$" + Math.round(t.net).toLocaleString()}
                                    </div>
                                </div>
                            </div>

                            <div class="flex justify-between items-center pt-3 border-t border-slate-800/80">
                                <div class="text-xs text-slate-400">
                                    <span class="text-slate-500 block mb-0.5">Gross Salary</span>
                                    <span class="font-mono font-semibold">{"$" + Math.round(t.gross).toLocaleString()}</span>
                                </div>
                                <div class="text-xs text-right text-slate-400">
                                    <span class="text-slate-500 block mb-0.5">Annual Health Ins.</span>
                                    <span class="font-mono text-slate-400 font-medium">{"-$" + Math.round(t.annualHcCost).toLocaleString()}</span>
                                </div>
                            </div>
                        </div>
                    ))}
                </div>

                <div class="text-center mt-10 px-6">
                    <p class="text-[10px] text-slate-600 font-medium">Calculations are modeled estimates based on proposed matrix distribution rules and current step placements. Consult final printed TA for official figures.</p>
                </div>

            </div>
          );
        };

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<MemberPortal />);
    </script>
</body>
</html>
