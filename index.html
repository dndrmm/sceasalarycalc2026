          ]
        };

        const SPED_CASELOAD = {
            "none": { label: "None / Not Applicable", amount: 0 },
            "1-15": { label: "1 to 15 Students (+$200)", amount: 200 },
            "16-30": { label: "16 to 30 Students (+$300)", amount: 300 },
            "31-45": { label: "31 to 45 Students (+$400)", amount: 400 },
            "46+": { label: "46+ Students (+$500)", amount: 500 }
        };

        const EPED_BANDS = {
            "A": [5020, 5020, 5170, 5325, 5484],
            "B": [3263, 3263, 3412, 3515, 3619],
            "C": [2912, 2912, 2999, 3089, 3181],
            "D": [1857, 1857, 1913, 1970, 2029],
            "E": [1155, 1155, 1189, 1225, 1261],
            "F": [1004, 1004, 1034, 1065, 1097],
            "G": [853, 853, 879, 905, 932],
            "H": [552, 552, 569, 586, 603]
        };

        const EPED_POSITIONS = [
            { name: "Marching Band: Director", band: "A" },
            { name: "Yearbook Advisor (CHS)", band: "B" },
            { name: "Musical: Director", band: "C" },
            { name: "Mock Trial Advisor (CHS)", band: "C" },
            { name: "Dept. & Grade Level Heads", band: "C" },
            { name: "Band Director (CHS & SCMS)", band: "D" },
            { name: "Chorus Director (CHS & SCMS)", band: "D" },
            { name: "Marching Band: Assistant Director", band: "D" },
            { name: "Musical: Music Director", band: "D" },
            { name: "Musical: Box Office Manager", band: "E" },
            { name: "National Honor Society (CHS)", band: "E" },

            { name: "Student Council (SCMS)", band: "E" },

            { name: "Archery Club Advisor (SCMS)", band: "F" },

            { name: "Drama Club (SCMS)", band: "F" },
            { name: "Foreign Language Club (CHS)", band: "F" },
            { name: "Marching Band: Staff Assistant", band: "F" },
            { name: "Musical: Production Assistant", band: "F" },
            { name: "Ski Club Advisor (CHS)", band: "F" },
            { name: "Ski Club Advisor (SCMS)", band: "F" },
            { name: "Student Council (MES)", band: "F" },
            { name: "Business Club Advisor (CHS)", band: "G" },
            { name: "Class Advisor: Freshman", band: "G" },
            { name: "Class Advisor: Junior", band: "G" },
            { name: "Class Advisor: Sophomore", band: "G" },
            { name: "Future Teachers Club (CHS)", band: "G" },
            { name: "Mentor Teachers", band: "G" },
            { name: "Yearbook Advisor (MES)", band: "G" },
            { name: "Yearbook Advisor (SCE)", band: "G" },
            { name: "Envirothon Advisor (CHS)", band: "H" },
            { name: "Envirothon Advisor (SCMS)", band: "H" },
            { name: "National Junior Honor Society (SCMS)", band: "H" },
            { name: "SADD Advisor (CHS)", band: "H" },

            { name: "Student Broadcast Club Advisor (SCMS)", band: "H" },

            { name: "Technology Liaison (MES)", band: "H" },
            { name: "Technology Liaison (SCE)", band: "H" },
            { name: "Technology Liaison (SCMS)", band: "H" }

        const MemberPortal = () => {
          const [activeModel, setActiveModel] = useState("Model A");
          const [userStep, setUserStep] = useState(MODELS["Model A"][0].matrix[0].step);
          const [userLane, setUserLane] = useState('b');
          const [insurance, setInsurance] = useState('single');
          const [caseload, setCaseload] = useState('none');
          const [selectedEped, setSelectedEped] = useState([]);

          const memberTrajectory = useMemo(() => {
              let trajectory = [];
              let aggregateNet = 0;
              let currentStepsFromTop = 0;
              
              const currentModelData = MODELS[activeModel];
              const year0Matrix = currentModelData[0].matrix;
              const initialIndex = year0Matrix.findIndex(r => r.step == userStep);
              
              if (initialIndex !== -1) currentStepsFromTop = year0Matrix.length - 1 - initialIndex;

              currentModelData.forEach((proj, y) => {
                  if (y > 0) currentStepsFromTop = Math.max(0, currentStepsFromTop - 1);
                  let activeRow = proj.matrix[proj.matrix.length - 1 - currentStepsFromTop];
                  if (!activeRow) return;

                  let baseGross = Number(activeRow.bSalary) || 0;
                  if (userLane === 'm') baseGross += LANE_DIFF;
                  if (userLane === 'm30') baseGross += (LANE_DIFF * 2);

                  let epedAmount = 0;
                  selectedEped.forEach(posName => {
                      const epedData = EPED_POSITIONS.find(p => p.name === posName);
                      if (epedData) epedAmount += EPED_BANDS[epedData.band][y];
                  });

                  let caseloadAmount = SPED_CASELOAD[caseload].amount;
                  let gross = baseGross + epedAmount + caseloadAmount;

                  const safeMonthIndex = Math.min(y, (MONTHLY_HEALTHCARE[insurance]?.length - 1) || 0);
                  const annualHcCost = insurance === 'none' ? 0 : (MONTHLY_HEALTHCARE[insurance][safeMonthIndex] * 12);
                  const net = gross - annualHcCost;

                  if (y > 0) aggregateNet += net;

                  trajectory.push({
                      year: y,
                      stepLabel: activeRow.step,
                      baseGross,
                      extraPayTotal: epedAmount + caseloadAmount,
                      gross,
                      annualHcCost,
                      net
                  });
              });

              return { trajectory, aggregateNet };
          }, [userStep, userLane, insurance, activeModel, selectedEped, caseload]);

          return (

                                        ? 'bg-blue-600 text-white shadow-md' 
                                        : 'text-slate-400 hover:text-white'
                                    }`}
                                >
                                    {modelName}
                                </button>
                            ))}
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5 ml-1">Current Base Step</label>
                        <select value={userStep} onChange={(e) => setUserStep(e.target.value)} class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-4 text-base font-semibold shadow-lg outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition">
                            {MODELS[activeModel][0].matrix.map(m => (
                            <option key={m.step} value={m.step}>{"Step " + m.step}</option>
                            ))}
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5 ml-1">Current Column / Track</label>
                        <select value={userLane} onChange={(e) => setUserLane(e.target.value)} class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-4 text-base font-semibold shadow-lg outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition">
                            <option value="b">Bachelors (B)</option>
                            <option value="m">Masters (M)</option>
                            <option value="m30">Masters + 30 (M+30)</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5 ml-1">Healthcare Election</label>
                        <select value={insurance} onChange={(e) => setInsurance(e.target.value)} class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-4 text-base font-semibold shadow-lg outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition">
                            <option value="single">Single Plan</option>
                            <option value="nonSingle">Non-Single Plan (Family/Couple)</option>
                            <option value="none">Opt-Out / No District Healthcare</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5 ml-1">Caseload / Student Count</label>
                        <select value={caseload} onChange={(e) => setCaseload(e.target.value)} class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-4 text-base font-semibold shadow-lg outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition">
                            {Object.entries(SPED_CASELOAD).map(([key, data]) => (
                                <option key={key} value={key}>{data.label}</option>
                            ))}
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5 ml-1">Extra Duty Positions (EPED)</label>
                        {selectedEped.length > 0 && (
                            <div class="mb-3 space-y-2">
                                {selectedEped.map(pos => {
                                    const epedData = EPED_POSITIONS.find(p => p.name === pos);
                                    return (
                                        <div key={pos} class="flex justify-between items-center bg-slate-800 border border-slate-700 px-3 py-2 rounded-lg text-sm text-slate-200">
                                            <span class="truncate pr-2">{pos} <span class="text-xs text-slate-400 ml-1">(Cat {epedData.band})</span></span>
                                            <button onClick={() => setSelectedEped(selectedEped.filter(p => p !== pos))} class="text-red-400 hover:text-red-300 font-bold p-1 text-lg leading-none">&times;</button>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        </select>

                </div>

                        <span class="block text-xs font-bold text-emerald-500 uppercase tracking-widest mb-1">{"Total " + YEARS + "-Year Contract Value"}</span>
                        <div class="text-4xl font-black text-emerald-400 font-mono tracking-tight shadow-emerald-400/20 drop-shadow-lg">

                        </div>
                        <span class="block text-[10px] text-slate-500 mt-2 font-medium">{"Combined net take-home pay over " + YEARS + " years."}</span>

                        <div class="mt-4 pt-4 border-t border-emerald-800/50">
                            <span class="block text-xs font-bold text-emerald-500 uppercase tracking-widest mb-1">Final Year Net Increase</span>

                            </div>
                            <span class="block text-[10px] text-slate-500 mt-1 font-medium">{"How much more you will take home in Year " + YEARS + " vs. today."}</span>
                        </div>
                    </div>
                </div>

                <div class="px-6 mt-8 space-y-4">
                    <h3 class="text-sm font-bold text-white border-b border-slate-800 pb-2 ml-1">Year-by-Year Breakdown</h3>

                    {memberTrajectory.trajectory.map((t, idx) => (
                        <div key={idx} class={"p-5 rounded-xl border " + (idx === 0 ? "bg-slate-900/50 border-slate-800 border-dashed" : "bg-slate-900 border-slate-700 shadow-md")}>
                            <div class="flex justify-between items-end mb-3">
                                <div>
                                    <div class={"text-sm font-black " + (idx === 0 ? "text-slate-400" : "text-blue-400")}>
                                        {idx === 0 ? "Current Pay (Baseline)" : "Contract Year " + idx}
                                    </div>
                                    <div class="text-xs text-slate-500 font-medium mt-0.5">{"Assumed Level: Step " + t.stepLabel}</div>
                                </div>
                                <div class="text-right">
                                    <div class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-0.5">Net Pay</div>
                                    <div class={"text-xl font-black font-mono " + (idx === 0 ? "text-slate-300" : "text-white")}>
                                        {"$" + Math.round(t.net).toLocaleString()}
                                    </div>
                                </div>
                            </div>

                            <div class="flex justify-between items-center pt-3 border-t border-slate-800/80 mt-2">
                                <div class="text-xs text-slate-400">
                                    <span class="text-slate-500 block mb-0.5">Base Salary</span>
                                    <span class="font-mono font-semibold">{"$" + Math.round(t.baseGross).toLocaleString()}</span>
                                </div>
                                { t.extraPayTotal > 0 && (
                                    <div class="text-xs text-center text-slate-400">
                                        <span class="text-slate-500 block mb-0.5">Extra Pay</span>
                                        <span class="font-mono text-emerald-400 font-medium">{"+$" + Math.round(t.extraPayTotal).toLocaleString()}</span>
                                    </div>
                                )}
                                <div class="text-xs text-right text-slate-400">
                                    <span class="text-slate-500 block mb-0.5">Annual Health Ins.</span>
                                    <span class="font-mono text-slate-400 font-medium">{"-$" + Math.round(t.annualHcCost).toLocaleString()}</span>
                                </div>
                            </div>
                        </div>
                    ))}
                </div>

                <div class="text-center mt-10 px-6">
                    <p class="text-[10px] text-slate-600 font-medium">Calculations are modeled estimates based on proposed matrix distribution rules and current step placements. Consult final printed TA for official figures.</p>
                </div>

            </div>
          );
        };

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<MemberPortal />);
    </script>
</body>
</html>
