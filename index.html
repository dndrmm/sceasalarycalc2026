            { name: "Technology Liaison (SCE)", band: "H" },

        const MemberPortal = () => {
          const [activeModel, setActiveModel] = useState("Model A");
          const [userStep, setUserStep] = useState(MODELS["Model A"][0].matrix[0].step);
          const [userLane, setUserLane] = useState('b');
          const [insurance, setInsurance] = useState('single');
          const [caseload, setCaseload] = useState('none');
          const [selectedEped, setSelectedEped] = useState([]);
          const [customVals, setCustomVals] = useState({ 1: '', 2: '', 3: '', 4: '' });

          const memberTrajectory = useMemo(() => {
              let trajectory = [];
              let aggregateNet = 0;
              let aggregateBaseNet = 0;
              let currentStepsFromTop = 0;
              
              let currentModelData;
              if (activeModel === "Custom") {
                  currentModelData = [0, 1, 2, 3, 4].map(y => {
                      let sal = 0;
                      if (y === 0) {
                          const row = MODELS["Model A"][0].matrix.find(r => r.step == userStep);
                          sal = row ? row.bSalary : 0;
                      } else {
                          sal = Number(customVals[y]) || 0;
                      }
                      return {
                          year: y,
                          matrix: Array.from({length: 30}, (_, i) => ({ step: String(i+1), bSalary: sal }))
                      };
                  });
              } else {
                  currentModelData = MODELS[activeModel];
              }

              const year0Matrix = currentModelData[0].matrix;
              const initialIndex = year0Matrix.findIndex(r => r.step == userStep);
              
              if (initialIndex !== -1) currentStepsFromTop = year0Matrix.length - 1 - initialIndex;

              currentModelData.forEach((proj, y) => {
                  if (y > 0) currentStepsFromTop = Math.max(0, currentStepsFromTop - 1);
                  let activeRow = proj.matrix[proj.matrix.length - 1 - currentStepsFromTop];
                  if (!activeRow) return;

                  let baseGross = Number(activeRow.bSalary) || 0;
                  
                  // ONLY add lane differentials for standard models OR Year 0 of the Custom model
                  if (activeModel !== "Custom" || y === 0) {
                      if (userLane === 'm') baseGross += LANE_DIFF;
                      if (userLane === 'm30') baseGross += (LANE_DIFF * 2);
                  }

                  let epedAmount = 0;
                  selectedEped.forEach(posName => {
                      const epedData = EPED_POSITIONS.find(p => p.name === posName);
                      if (epedData) epedAmount += EPED_BANDS[epedData.band][y];
                  });

                  let caseloadAmount = SPED_CASELOAD[caseload].amount;
                  let totalExtra = epedAmount + caseloadAmount;
                  
                  let gross = baseGross + totalExtra;

                  const safeMonthIndex = Math.min(y, (MONTHLY_HEALTHCARE[insurance]?.length - 1) || 0);
                  const annualHcCost = insurance === 'none' ? 0 : (MONTHLY_HEALTHCARE[insurance][safeMonthIndex] * 12);
                  
                  const baseNet = baseGross - annualHcCost;
                  const totalNet = gross - annualHcCost;

                  if (y > 0) {
                      aggregateNet += totalNet;
                      aggregateBaseNet += baseNet;
                  }

                  trajectory.push({
                      year: y,
                      stepLabel: activeModel === "Custom" && y > 0 ? "Manual Input" : activeRow.step,
                      baseGross,
                      extraPayTotal: totalExtra,
                      gross,
                      annualHcCost,
                      net: totalNet
                  });
              });

              return { trajectory, aggregateNet, aggregateBaseNet };
          }, [userStep, userLane, insurance, activeModel, selectedEped, caseload, customVals]);

          const baseTrajectory = memberTrajectory.trajectory;
          const baselineYear0Net = baseTrajectory[0].net;
          const finalYearNet = baseTrajectory[baseTrajectory.length - 1].net;
          const totalGrowth = finalYearNet - baselineYear0Net;

          return (
            <div class="max-w-md mx-auto min-h-screen bg-slate-950 pb-16">

                                        : 'text-slate-400 hover:text-white'
                                    }`}
                                >

                                </button>
                            ))}

                                    ? 'bg-blue-600 text-white shadow-md' 
                                    : 'text-slate-400 hover:text-white'
                                }`}
                            >
                                Custom
                            </button>
                        </div>
                    
                        {/* The Four Custom Input Boxes */}

                                <div class="grid grid-cols-2 gap-3">

                                            <label class="text-[10px] text-slate-500 font-bold uppercase mb-1 block">Year {y}</label>
                                            <div class="relative">
                                                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 font-bold">$</span>
                                                <input 
                                                    type="number"

                                                    placeholder="e.g. 60000"
                                                    class="w-full bg-slate-950 border border-slate-700 text-white rounded-lg py-2 pl-7 pr-3 text-sm font-mono focus:border-blue-500 outline-none"
                                                />
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <p class="text-[10px] text-slate-500 mt-3 leading-tight">Input your salary each year. The calculator will automatically add your Extra Duty pay and deduct healthcare.</p>
                            </div>
                        )}
                    </div>

                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5 ml-1">Special Ed. Caseload</label>
                        <div class="grid grid-cols-5 gap-1.5 bg-slate-900 p-1 border border-slate-800 rounded-xl">
                            {Object.entries(SPED_CASELOAD).map(([key, data]) => (
                                <button
                                    key={key}
                                    type="button"
                                    onClick={() => setCaseload(key)}
                                    class={`py-2 text-[11px] font-bold rounded-lg transition truncate px-1 ${
                                        caseload === key 
                                        ? 'bg-blue-600 text-white shadow' 
                                        : 'text-slate-400 hover:text-white'
                                    }`}
                                >
                                    {data.label.split(' ')[0]}
                                </button>
                            ))}
                        </div>
                    </div>
                    
                    {/* Extra Duty Positions (EPED) */}
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5 ml-1">Extra Duty Positions (EPED)</label>
                        {selectedEped.length > 0 && (
                            <div class="mb-2 space-y-1.5">
                                {selectedEped.map(pos => {
                                    const epedData = EPED_POSITIONS.find(p => p.name === pos);
                                    return (
                                        <div key={pos} class="flex justify-between items-center bg-slate-900 border border-slate-800 px-3 py-2 rounded-lg text-xs text-slate-200">
                                            <span class="truncate pr-2 font-medium">{pos} <span class="text-[10px] text-slate-500">(Cat {epedData.band})</span></span>
                                            <button onClick={() => setSelectedEped(selectedEped.filter(p => p !== pos))} class="text-red-400 hover:text-red-300 font-bold px-1.5 text-base">&times;</button>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                        <select value="" onChange={(e) => { if(e.target.value) setSelectedEped([...selectedEped, e.target.value]) }} class="w-full bg-slate-900 border border-slate-800 text-white rounded-xl p-3.5 text-sm font-semibold shadow-inner outline-none focus:border-blue-500 transition">
                            <option value="">+ Add Extra Duty Position...</option>
                            {EPED_POSITIONS.filter(p => !selectedEped.includes(p.name)).map(p => (
                                <option key={p.name} value={p.name}>{p.name}</option>
                            ))}
                        </select>
                    </div>
                </div>

                {/* Highlights Card (Excludes Stipends for Base Contract Focus) */}
                <div class="px-6 mt-8">
                    <div class="bg-emerald-950/30 border border-emerald-900/40 rounded-2xl p-6 text-center shadow-xl">
                        <span class="block text-xs font-bold text-emerald-400 uppercase tracking-widest mb-1">{"Base Contract Value (" + YEARS + " Years)"}</span>
                        <div class="text-4xl font-black text-emerald-300 font-mono tracking-tight drop-shadow">
                            {"$" + Math.round(memberTrajectory.aggregateBaseNet).toLocaleString()}
                        </div>
                        <span class="block text-[11px] text-slate-400 mt-1.5 font-medium">Combined net take-home base pay (excluding stipends).</span>

                        <div class="mt-4 pt-4 border-t border-emerald-900/40">
                            <span class="block text-xs font-bold text-emerald-400 uppercase tracking-widest mb-1">Final Year Base Net Increase</span>
                            <div class="text-2xl font-black text-white font-mono">
                                {"+$" + Math.round(totalGrowth).toLocaleString()}
                            </div>
                            <span class="block text-[11px] text-slate-400 mt-1 font-medium">{"Extra annual take-home in Year " + YEARS + " vs. today."}</span>
                        </div>
                    </div>
                </div>

                {/* Year by Year Breakdown (Enhanced Mobile Font Sizes) */}
                <div class="px-6 mt-8 space-y-4">
                    <h3 class="text-sm font-bold text-white border-b border-slate-800 pb-2 ml-1 tracking-wide">Year-by-Year Breakdown</h3>

                    {memberTrajectory.trajectory.map((t, idx) => (
                        <div key={idx} class={"p-5 rounded-xl border " + (idx === 0 ? "bg-slate-900/40 border-slate-800 border-dashed" : "bg-slate-900 border-slate-700 shadow-lg")}>
                            <div class="flex justify-between items-end mb-3">
                                <div>
                                    <div class={"text-sm font-black " + (idx === 0 ? "text-slate-400" : "text-blue-400")}>
                                        {idx === 0 ? "Current Pay (Baseline)" : "Contract Year " + idx}
                                    </div>
                                    <div class="text-xs text-slate-400 font-semibold mt-0.5">{"Assumed Level: Step " + t.stepLabel}</div>
                                </div>
                                <div class="text-right">
                                    <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-0.5">Total Net Pay</div>
                                    <div class={"text-xl font-black font-mono " + (idx === 0 ? "text-slate-200" : "text-white")}>
                                        {"$" + Math.round(t.net).toLocaleString()}
                                    </div>
                                </div>
                            </div>

                            <div class="grid grid-cols-3 gap-2 pt-3 border-t border-slate-800/80 mt-2 text-xs">
                                <div>
                                    <span class="text-slate-400 block mb-0.5 font-medium">Base Salary</span>
                                    <span class="font-mono font-bold text-slate-200">{"$" + Math.round(t.baseGross).toLocaleString()}</span>
                                </div>
                                <div class="text-center">
                                    <span class="text-slate-400 block mb-0.5 font-medium">Extra Pay</span>
                                    <span class="font-mono font-bold text-emerald-400">{t.extraPayTotal > 0 ? "+$" + Math.round(t.extraPayTotal).toLocaleString() : "$0"}</span>
                                </div>
                                <div class="text-right">
                                    <span class="text-slate-400 block mb-0.5 font-medium">Health Ins.</span>
                                    <span class="font-mono font-bold text-slate-400">{"-$" + Math.round(t.annualHcCost).toLocaleString()}</span>
                                </div>
                            </div>
                        </div>
                    ))}
                </div>

                <div class="text-center mt-10 px-6">
                    <p class="text-[11px] text-slate-500 font-medium leading-relaxed">Calculations are modeled estimates based on proposed matrix distribution rules and current step placements. Consult final printed TA for official figures.</p>
                </div>

            </div>
          );
        };

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<MemberPortal />);
    </script>
</body>
</html>
